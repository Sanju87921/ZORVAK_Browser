<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <style>
    :root {
      --glass-bg: rgba(12, 17, 26, 0.16);
      --glass-bg-hover: rgba(20, 28, 42, 0.28);
      --glass-border: rgba(255, 255, 255, 0.14);
      --glass-border-focus: rgba(0, 229, 153, 0.55);
      --accent-emerald: #00E599;
      --text-primary: #FFFFFF;
      --text-secondary: rgba(255, 255, 255, 0.72);
      --text-muted: rgba(255, 255, 255, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: 
        linear-gradient(180deg, rgba(0, 0, 0, 0.22) 0%, rgba(0, 0, 0, 0) 25%, rgba(0, 0, 0, 0) 75%, rgba(0, 0, 0, 0.3) 100%),
        url('bg_image.png') no-repeat center center fixed;
      background-size: cover;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Main Center Wrapper */
    .hero-container {
      width: 100%;
      max-width: 680px;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-top: -4vh; /* Subtle upper-middle optical balance */
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Brand Lockup */
    .brand-lockup {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 26px;
    }

    .brand-header {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin-bottom: 8px;
    }

    .brand-emblem {
      width: 56px;
      height: 56px;
      object-fit: contain;
      filter: drop-shadow(0 3px 10px rgba(0, 0, 0, 0.45)) drop-shadow(0 0 12px rgba(0, 229, 153, 0.4));
      transition: transform 0.25s ease;
    }

    .brand-header:hover .brand-emblem {
      transform: scale(1.06);
    }

    .brand-title {
      font-size: 42px;
      font-weight: 700;
      letter-spacing: 4px;
      color: var(--text-primary);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.55);
      line-height: 1;
    }

    .brand-tagline {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.8px;
      color: var(--text-secondary);
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.75);
    }

    /* Central Search Bar */
    .search-wrapper {
      width: 100%;
      margin-bottom: 28px;
      position: relative;
    }

    .search-form {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 18px;
      width: 17px;
      height: 17px;
      fill: var(--text-muted);
      pointer-events: none;
      transition: fill 0.2s ease;
    }

    .search-input {
      width: 100%;
      height: 48px;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 0 48px 0 46px;
      font-size: 15px;
      color: var(--text-primary);
      outline: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.22);
    }

    .search-input::placeholder {
      color: var(--text-muted);
      font-weight: 400;
    }

    .search-input:hover {
      background: var(--glass-bg-hover);
      border-color: rgba(255, 255, 255, 0.22);
    }

    .search-input:focus {
      background: rgba(10, 14, 22, 0.32);
      border-color: var(--glass-border-focus);
      box-shadow: 0 0 0 3px rgba(0, 229, 153, 0.12), 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .search-input:focus ~ .search-icon {
      fill: var(--accent-emerald);
    }

    .search-actions {
      position: absolute;
      right: 7px;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .search-action-btn,
    .search-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .search-action-btn svg,
    .search-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .search-action-btn:hover,
    .search-btn:hover {
      background: rgba(0, 229, 153, 0.2);
      color: var(--accent-emerald);
      transform: scale(1.05);
    }

    /* Floating Weather Badge (Top-Right) */
    .weather-badge {
      position: fixed;
      top: 18px;
      right: 24px;
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(12, 17, 26, 0.18);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 5px 12px;
      font-size: 12px;
      color: var(--text-secondary);
      user-select: none;
      transition: all 0.2s ease;
      z-index: 50;
    }

    .weather-badge:hover {
      background: rgba(20, 28, 42, 0.3);
      border-color: rgba(255, 255, 255, 0.2);
      color: var(--text-primary);
    }

    .weather-icon {
      color: #F59E0B;
      font-size: 14px;
    }

    .weather-temp {
      font-weight: 600;
      color: var(--text-primary);
    }

    .weather-loc {
      color: var(--text-muted);
      font-size: 11px;
    }

    /* Bottom Status Cards (Screenshot 1) */
    .bottom-cards-row {
      position: fixed;
      bottom: 24px;
      left: 36px;
      right: 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 40;
    }

    .bottom-card {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(10, 18, 20, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 10px 18px;
      max-width: 290px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.3);
      transition: all 0.2s ease;
    }

    .bottom-card:hover {
      background: rgba(14, 24, 28, 0.75);
      border-color: rgba(0, 229, 153, 0.35);
      transform: translateY(-2px);
    }

    .bottom-card-icon {
      font-size: 22px;
      color: #00E599;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bottom-card-text {
      display: flex;
      flex-direction: column;
      text-align: left;
    }

    .bottom-card-title {
      font-size: 13px;
      font-weight: 600;
      color: #FFFFFF;
      margin-bottom: 2px;
    }

    .bottom-card-desc {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.65);
      line-height: 1.3;
    }

    .bottom-center-chevron {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.55);
      font-size: 18px;
      cursor: pointer;
      transition: all 0.2s;
      z-index: 40;
      pointer-events: auto;
    }

    .bottom-center-chevron:hover {
      color: #00E599;
      transform: translateX(-50%) translateY(2px);
    }

    /* Shortcuts Row */
    .shortcuts-row {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 24px;
      flex-wrap: nowrap;
      margin-top: 4px;
    }

    .shortcut-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: var(--text-primary);
      cursor: pointer;
      width: 72px;
      transition: transform 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .shortcut-item:hover {
      transform: translateY(-2px);
    }

    .shortcut-item:active {
      transform: scale(0.96);
    }

    .shortcut-tile {
      width: 62px;
      height: 62px;
      border-radius: 16px;
      background: rgba(10, 18, 20, 0.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.13);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      transition: all 0.18s ease-out;
    }

    .shortcut-item:hover .shortcut-tile {
      background: rgba(14, 24, 28, 0.72);
      border-color: rgba(0, 229, 153, 0.42);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.36), 0 0 14px rgba(0, 229, 153, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    .shortcut-icon {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .shortcut-icon svg {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .shortcut-label {
      font-size: 12px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 72px;
      text-align: center;
      transition: color 0.18s ease;
    }

    .shortcut-item:hover .shortcut-label {
      color: #FFFFFF;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 1), 0 0 8px rgba(0, 229, 153, 0.3);
    }
  </style>
</head>
<body>

  <!-- Small floating weather badge in top-right -->
  <div class="weather-badge" id="weatherBadge">
    <span class="weather-icon">☀</span>
    <span class="weather-temp">24°C</span>
    <span class="weather-loc">Bengaluru</span>
  </div>

  <div class="hero-container">
    <!-- Brand Lockup -->
    <div class="brand-lockup">
      <div class="brand-header">
        <img src="gavix_icon.png" alt="GAVIX" class="brand-emblem">
        <h1 class="brand-title">GAVIX</h1>
      </div>
      <p class="brand-tagline">GATEWAY FOR ADVANCED VIRTUAL INTERNET EXPERIENCE</p>
    </div>

    <!-- Central Search Bar -->
    <div class="search-wrapper">
      <form class="search-form" id="searchForm" onsubmit="handleSearch(event)">
        <svg class="search-icon" viewBox="0 0 24 24">
          <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input 
          type="text" 
          id="queryInput" 
          class="search-input" 
          placeholder="Search the web securely with GAVIX..." 
          autocomplete="off"
          autofocus
        >
        <div class="search-actions">
          <button type="button" class="search-action-btn" title="Voice Search" onclick="alert('GAVIX Voice Search: Microphone ready')">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
          </button>
          <button type="button" class="search-action-btn" title="Visual Lens Search" onclick="alert('GAVIX Visual Lens: Select image or camera')">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M21 6h-3.17L16 4H8L6.17 6H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-9 13c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.65 0-3 1.35-3 3s1.35 3 3 3 3-1.35 3-3-1.35-3-3-3z"/></svg>
          </button>
          <button type="submit" class="search-btn" title="Search">
            <svg viewBox="0 0 24 24">
              <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </form>
    </div>

    <!-- Compact Horizontal Shortcuts Row -->
    <div class="shortcuts-row" id="shortcutsRow">
      <!-- Injected via JavaScript data-driven ShortcutTile component -->
    </div>
  </div>

  <!-- Bottom Floating Status Cards (Screenshot 1) -->
  <div class="bottom-cards-row">
    <div class="bottom-card">
      <div class="bottom-card-icon">🛡</div>
      <div class="bottom-card-text">
        <span class="bottom-card-title">Privacy First</span>
        <span class="bottom-card-desc">Your data stays with you.</span>
      </div>
    </div>

    <div class="bottom-card">
      <div class="bottom-card-icon">⚡</div>
      <div class="bottom-card-text">
        <span class="bottom-card-title">Faster Internet</span>
        <span class="bottom-card-desc">Optimized search and browsing.</span>
      </div>
    </div>
  </div>

  <!-- Center subtle chevron -->
  <div class="bottom-center-chevron" title="More Information">⌄</div>

  <script>
    const SHORTCUTS_DATA = [
      {
        name: "YouTube",
        url: "https://www.youtube.com",
        svg: `<svg viewBox="0 0 24 24"><path fill="#FF0000" d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814z"/><polygon fill="#FFFFFF" points="9.545,15.568 15.818,12 9.545,8.432"/></svg>`
      },
      {
        name: "GitHub",
        url: "https://github.com",
        svg: `<svg viewBox="0 0 24 24"><path fill="#FFFFFF" fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>`
      },
      {
        name: "Notion",
        url: "https://www.notion.so",
        svg: `<svg viewBox="0 0 24 24"><path fill="#FFFFFF" d="M4.459 4.208c.746.606 1.026.56 2.428.466l11.205-.84c1.12-.093 1.54.327 1.54 1.213v12.788c0 .933-.42 1.307-1.493 1.4l-11.53.84c-1.12.093-1.634-.14-2.148-.793L2 16.05V5.561l2.459-1.353zm3.174 2.893c-.84.047-1.027.327-1.027.84v9.613c0 .513.327.7.98.653l1.82-.14V8.588l6.393 8.353 2.52-.187V7.607c0-.513-.327-.7-.98-.653l-1.68.14v7.794L9.206 6.961l-1.573.14z"/></svg>`
      },
      {
        name: "X",
        url: "https://x.com",
        svg: `<svg viewBox="0 0 24 24"><path fill="#FFFFFF" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>`
      },
      {
        name: "Reddit",
        url: "https://www.reddit.com",
        svg: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#FF4500"/><path fill="#FFFFFF" d="M16.67 13.12c.1.72-.4 1.38-1.12 1.48-.72.1-1.38-.4-1.48-1.12-.1-.72.4-1.38 1.12-1.48.72-.1 1.38.4 1.48 1.12zm-6.22.36c-.1.72-.76 1.22-1.48 1.12-.72-.1-1.22-.76-1.12-1.48.1-.72.76-1.22 1.48-1.12.72.1 1.22.76 1.12 1.48zm5.55 3.32c-.85.85-2.45.92-3.99.92s-3.14-.07-3.99-.92c-.17-.17-.17-.45 0-.62.17-.17.45-.17.62 0 .66.66 2.06.74 3.37.74 1.31 0 2.71-.08 3.37-.74.17-.17.45-.17.62 0 .17.17.17.45 0 .62z"/></svg>`
      }
    ];

    function renderShortcuts() {
      const container = document.getElementById('shortcutsRow');
      if (!container) return;

      let html = '';
      SHORTCUTS_DATA.forEach(item => {
        html += `
          <div class="shortcut-item" onclick="openUrl('${item.url}')">
            <div class="shortcut-tile">
              <div class="shortcut-icon">
                ${item.svg}
              </div>
            </div>
            <span class="shortcut-label">${item.name}</span>
          </div>
        `;
      });

      // Add shortcut tile
      html += `
        <div class="shortcut-item" onclick="promptAddShortcut()">
          <div class="shortcut-tile">
            <div class="shortcut-icon">
              <svg viewBox="0 0 24 24" stroke="rgba(255,255,255,0.78)" stroke-width="2.2" fill="none" stroke-linecap="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
            </div>
          </div>
          <span class="shortcut-label">Add shortcut</span>
        </div>
      `;

      container.innerHTML = html;
    }

    renderShortcuts();

    function handleSearch(e) {
      e.preventDefault();
      const q = document.getElementById('queryInput').value.trim();
      if (!q) return;

      if (q.startsWith('http://') || q.startsWith('https://')) {
        window.location.href = q;
      } else if (q.includes('.') && !q.includes(' ')) {
        window.location.href = 'https://' + q;
      } else {
        window.location.href = 'http://127.0.0.1:8000/api/v1/search?q=' + encodeURIComponent(q);
      }
    }

    function openUrl(url) {
      window.location.href = url;
    }

    function promptAddShortcut() {
      const name = prompt("Enter shortcut name (e.g., Wikipedia):");
      if (!name) return;
      const url = prompt("Enter website URL (e.g., https://wikipedia.org):");
      if (!url) return;

      const cleanUrl = url.startsWith('http') ? url : 'https://' + url;
      SHORTCUTS_DATA.push({
        name: name,
        url: cleanUrl,
        svg: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#00E599"/><text x="12" y="16" font-size="12" font-weight="bold" fill="#080B10" text-anchor="middle">${name.charAt(0).toUpperCase()}</text></svg>`
      });
      renderShortcuts();
    }
  </script>
</body>
</html>
